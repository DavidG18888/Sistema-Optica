<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Catálogo de aros</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><a class="brand" th:href="@{/}">◉ Sistema Óptica</a><nav><a th:href="@{/}">Panel</a><a th:href="@{/mediciones}">Mediciones</a><a th:href="@{/logout}">Cerrar sesión</a></nav></header><main class="wrap"><h1>Catálogo de aros</h1><div th:if="${ok}" class="notice" th:text="${ok}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div><section class="panel"><form method="get" th:action="@{/catalogo}" class="formgrid"><div><label>Marca</label><select name="marca"><option value="">Todas</option><option th:each="x:${marcas}" th:value="${x.marca}" th:text="${x.marca}"></option></select></div><div><label>Material</label><select name="material"><option value="">Todos</option><option th:each="x:${materiales}" th:value="${x.material}" th:text="${x.material}"></option></select></div><div><label>Forma</label><select name="forma"><option value="">Todas</option><option th:each="x:${formas}" th:value="${x.forma}" th:text="${x.forma}"></option></select></div><div><label>Precio mínimo</label><input name="min" type="number" min="0" step="0.01"></div><div><label>Precio máximo</label><input name="max" type="number" min="0" step="0.01"></div><div style="align-self:end"><button>Aplicar filtros</button> <a class="btn secondary" th:href="@{/catalogo}">Limpiar</a></div></form></section><section class="grid"><article class="panel" th:each="p:${items}"><span class="pill" th:text="${p.marca}"></span><h2 th:text="${p.nombre}"></h2><p class="muted"><span th:text="${p.material}"></span> · <span th:text="${p.forma}"></span></p><p><strong th:text="|L. ${p.precio}|">L. 0</strong> <span class="muted" th:text="| · Stock ${p.stock}|"></span></p><form th:if="${role == 'CLIENTE'}" method="post" th:action="@{/catalogo/apartar}"><input type="hidden" name="id_producto" th:value="${p.id_producto}"><button>Apartar aro</button></form></article><div th:if="${#lists.isEmpty(items)}" class="panel">No hay aros disponibles con esos filtros.</div></section><section class="panel" th:if="${apartados != null}"><h2>Mis aros apartados</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Aro</th><th>Marca</th><th>Estado</th></tr></thead><tbody><tr th:each="a:${apartados}"><td th:text="${a.fecha}"></td><td th:text="${a.nombre}"></td><td th:text="${a.marca}"></td><td th:text="${a.estado}"></td></tr></tbody></table></div></section></main></body></html>
