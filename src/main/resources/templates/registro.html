<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro · Sistema Óptica</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><a class="brand" th:href="@{/}">◉ Sistema Óptica</a><nav><a th:href="@{/login}">Iniciar sesión</a></nav></header><main class="wrap"><section class="panel login"><h1>Crear cuenta de cliente</h1><p class="muted">Completá tus datos para acceder al catálogo y tus mediciones.</p><div th:if="${error}" class="notice error" th:text="${error}"></div><form method="post" th:action="@{/registro}"><div style="margin-bottom:12px"><label>Nombre completo</label><input name="nombre" required></div><div style="margin-bottom:12px"><label>DNI</label><input name="dni" required></div><div style="margin-bottom:12px"><label>Teléfono</label><input name="telefono"></div><div style="margin-bottom:12px"><label>Correo</label><input name="correo" type="email" required></div><div style="margin-bottom:12px"><label>Contraseña (mínimo 8 caracteres)</label><input name="contrasena" type="password" minlength="8" required></div><button type="submit" style="width:100%">Crear cuenta</button></form></section></main></body></html>
