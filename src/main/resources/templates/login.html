<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión · Sistema Óptica</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><a class="brand" th:href="@{/}">◉ Sistema Óptica</a><nav><a th:href="@{/registro}">Crear cuenta</a></nav></header><main class="wrap"><section class="panel login"><h1>Bienvenida/o</h1><p class="muted">Ingresá con tu correo y contraseña.</p><div th:if="${error}" class="notice error" th:text="${error}"></div><div th:if="${ok}" class="notice" th:text="${ok}"></div><form method="post" th:action="@{/login}"><div style="margin-bottom:14px"><label>Correo electrónico</label><input name="correo" type="email" required autocomplete="username"></div><div style="margin-bottom:14px"><label>Contraseña</label><input name="contrasena" type="password" required autocomplete="current-password"></div><button type="submit" style="width:100%">Iniciar sesión</button></form><p class="muted">¿No tenés cuenta? <a th:href="@{/registro}">Registrate aquí</a></p></section></main></body></html>
