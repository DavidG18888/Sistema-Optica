<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mediciones</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><a class="brand" th:href="@{/}">◉ Sistema Óptica</a><nav><a th:href="@{/}">Panel</a><a th:href="@{/logout}">Cerrar sesión</a></nav></header><main class="wrap"><h1>Mediciones oftalmológicas</h1><div th:if="${ok}" class="notice" th:text="${ok}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div><section class="panel"><h2>Registrar medición</h2><form method="post" th:action="@{/mediciones/guardar}" class="formgrid"><div th:if="${clientes != null}"><label>Cliente</label><select name="id_cliente" required><option th:each="c:${clientes}" th:value="${c.id_cliente}" th:text="${c.nombre}"></option></select></div><div><label>Esfera</label><input name="esfera" type="number" step="0.25"></div><div><label>Cilindro</label><input name="cilindro" type="number" step="0.25"></div><div><label>Eje</label><input name="eje" type="number" min="0" max="180"></div><div><label>Adición</label><input name="adicion" type="number" step="0.25"></div><div><label>Observaciones</label><input name="observaciones"></div><div style="align-self:end"><button>Guardar medición</button></div></form></section><section class="panel"><h2>Historial</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th th:if="${role == 'VENDEDOR'}">Cliente</th><th>Fecha</th><th>Esfera</th><th>Cilindro</th><th>Eje</th><th>Adición</th><th>Observaciones</th></tr></thead><tbody><tr th:each="m:${items}"><td th:text="${m.id_medicion}"></td><td th:if="${role == 'VENDEDOR'}" th:text="${m.nombre}"></td><td th:text="${m.fecha}"></td><td th:text="${m.esfera}"></td><td th:text="${m.cilindro}"></td><td th:text="${m.eje}"></td><td th:text="${m.adicion}"></td><td th:text="${m.observaciones}"></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="8">No hay mediciones registradas.</td></tr></tbody></table></div></section></main></body></html>
