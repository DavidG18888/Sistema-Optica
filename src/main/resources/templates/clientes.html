<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clientes</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header><a class="brand" th:href="@{/}">◉ Sistema Óptica</a><nav><a th:href="@{/}">Panel</a><a th:href="@{/logout}">Cerrar sesión</a></nav></header><main class="wrap"><h1>Clientes registrados</h1><div th:if="${error}" class="notice error" th:text="${error}"></div><section class="panel"><div class="tablewrap"><table><thead><tr><th>ID cliente</th><th>Nombre</th><th>DNI</th><th>Teléfono</th><th>Correo</th></tr></thead><tbody><tr th:each="c:${items}"><td th:text="${c.id_cliente}"></td><td th:text="${c.nombre}"></td><td th:text="${c.dni}"></td><td th:text="${c.telefono}"></td><td th:text="${c.correo}"></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="5">No hay clientes registrados.</td></tr></tbody></table></div></section></main></body></html>
